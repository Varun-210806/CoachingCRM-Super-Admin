
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Coachify | Super Admin</title>

  <style>
    :root {
      font-family: Inter, system-ui, Arial, sans-serif;
      color: #17243b;
      background: #f3f6fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    header {
      background: #142541;
      color: white;
      padding: 22px max(24px, calc((100vw - 1120px)/2));
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 6px 0 0;
      color: #c5d1e5;
    }

    main {
      max-width: 1120px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .card {
      background: white;
      border: 1px solid #e1e7f0;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 5px 24px #1b34500c;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    label {
      display: block;
      font-weight: 650;
      margin: 14px 0 7px;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 12px;
      font: inherit;
      background: white;
    }

    button {
      background: #2463e5;
      border: 0;
      border-radius: 9px;
      padding: 12px 17px;
      color: white;
      font-weight: 700;
      cursor: pointer;
      margin-top: 16px;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .ghost {
      background: #e8effb;
      color: #24426c;
    }

    .danger {
      background: #fff0f0;
      color: #b91c1c;
      margin: 0;
      padding: 8px 11px;
    }

    #status {
      min-height: 24px;
      font-size: 14px;
      margin: 14px 0;
    }

    .error {
      color: #b91c1c;
    }

    .success {
      color: #166534;
    }

    .hide {
      display: none;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    td, th {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #e5eaf2;
      font-size: 14px;
    }

    th {
      color: #64748b;
    }

    small {
      color: #64748b;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    nav button {
      margin: 0;
    }

    @media (max-width: 760px) {
      .grid {
        grid-template-columns: 1fr;
      }

      header {
        padding: 22px;
      }

      table {
        display: block;
        overflow: auto;
      }
    }
  </style>
</head>

<body>

<header>
  <nav>
    <div>
      <h1>
        Coachify
        <span style="font-weight:400">
          / Super Admin
        </span>
      </h1>

      <p>
        Institutes and administrator management
      </p>
    </div>

    <button id="logout" class="ghost hide">
      Sign out
    </button>
  </nav>
</header>

<main>

  <p id="status" role="status"></p>

  <!-- SUPER ADMIN LOGIN -->
  <section
    id="login"
    class="card"
    style="max-width:460px;margin:35px auto"
  >
    <h2>Super Admin sign in</h2>

    <form id="loginForm">
      <label>Email</label>
      <input
        id="loginEmail"
        type="email"
        required
        autocomplete="username"
      >

      <label>Password</label>
      <input
        id="loginPassword"
        type="password"
        required
        autocomplete="current-password"
      >

      <button type="submit">
        Sign in
      </button>
    </form>
  </section>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hide">

    <div class="grid">

      <!-- CREATE INSTITUTE -->
      <section class="card">
        <h2>Create institute</h2>

        <form id="instituteForm">
          <label>Institute name</label>

          <input
            id="instituteName"
            placeholder="e.g. Institute A"
            required
            minlength="2"
          >

          <button type="submit">
            Create institute
          </button>
        </form>
      </section>

      <!-- CREATE ADMIN -->
      <section class="card">
        <h2>Add administrator</h2>

        <form id="adminForm">

          <label>Administrator name</label>
          <input
            id="adminName"
            required
            minlength="2"
          >

          <label>Administrator email</label>
          <input
            id="adminEmail"
            type="email"
            required
          >

          <label>Initial password (12+ characters)</label>
          <input
            id="adminPassword"
            type="password"
            required
            minlength="12"
            autocomplete="new-password"
          >

          <label>Assign to institute</label>
          <select
            id="adminInstitute"
            required
          ></select>

          <button type="submit">
            Create administrator
          </button>

        </form>

        <p>
          <small>
            Share initial credentials privately.
            Have the administrator change their
            password after first login.
          </small>
        </p>
      </section>

    </div>

    <!-- INSTITUTE LIST -->
    <section
      class="card"
      style="margin-top:20px"
    >
      <h2>Institutes</h2>
      <div id="institutes"></div>
    </section>

    <!-- ADMIN LIST -->
    <section
      class="card"
      style="margin-top:20px"
    >
      <h2>Institute administrators</h2>
      <div id="admins"></div>
    </section>

  </div>

</main>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// ----------------------------------------
// SUPABASE CONFIGURATION
// ----------------------------------------

// Replace these two values with the SAME
// Supabase project used by your existing CRM.

const url = "https://oaejfnsqloujtikxbpqm.supabase.co";
const key = "sb_publishable_x1_VYFc15tyiwXNwytusIA_NQ9aYC2X";

// Never use the service-role key here.

const client = createClient(url, key);

const $ = id => document.getElementById(id);

function show(message, error = false) {
  $("status").textContent = message;
  $("status").className =
    error ? "error" : "success";
}

function escapeHtml(s) {
  return String(s ?? "").replace(
    /[&<>"']/g,
    c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c])
  );
}

let data = {
  institutes: [],
  admins: []
};

// ----------------------------------------
// SECURE API REQUEST
// ----------------------------------------

async function request(payload) {

  const {
    data: sessionData,
    error
  } = await client.auth.getSession();

  if (error || !sessionData.session) {
    throw Error("Please sign in again");
  }

  const res = await fetch(
    url + "/functions/v1/super-admin",
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "apikey": key,
        "Authorization":
          "Bearer " +
          sessionData.session.access_token
      },

      body: JSON.stringify(payload)
    }
  );

  let body;

  try {
    body = await res.json();
  } catch {
    throw Error(
      "Server returned an invalid response"
    );
  }

  if (!res.ok) {
    throw Error(
      body.error || "Request failed"
    );
  }

  return body;
}

// ----------------------------------------
// RENDER INSTITUTES AND ADMINS
// ----------------------------------------

function render() {

  const instituteMap = new Map(
    data.institutes.map(i => [i.id, i.name])
  );

  // Institute dropdown
  $("adminInstitute").replaceChildren(
    new Option("Select institute", ""),

    ...data.institutes.map(
      i => new Option(i.name, i.id)
    )
  );

  // Institute table
  $("institutes").innerHTML =
    data.institutes.length

    ? `<table>
        <thead>
          <tr>
            <th>Institute</th>
            <th>Admins</th>
          </tr>
        </thead>
        <tbody>
          ${data.institutes.map(i => `
            <tr>
              <td>${escapeHtml(i.name)}</td>
              <td>
                ${
                  data.admins.filter(
                    a => a.institute_id === i.id
                  ).length
                }
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>`

    : "<p>No institutes yet.</p>";

  // Admin table
  $("admins").innerHTML =
    data.admins.length

    ? `<table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Institute</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          ${data.admins.map(a => `
            <tr>
              <td>
                ${escapeHtml(a.name || a.id)}
              </td>

              <td>
                ${
                  escapeHtml(
                    instituteMap.get(a.institute_id)
                    || "Unassigned"
                  )
                }
              </td>

              <td>
                <button
                  class="danger"
                  data-disable="${escapeHtml(a.id)}"
                >
                  Disable
                </button>
              </td>
            </tr>
          `).join("")}
        </tbody>
      </table>`

    : "<p>No administrators yet.</p>";
}

// ----------------------------------------
// LOAD DASHBOARD
// ----------------------------------------

async function load() {
  data = await request({
    action: "list"
  });

  render();
}

// ----------------------------------------
// AUTHENTICATION
// ----------------------------------------

async function refresh() {

  const { data: sessionData } =
    await client.auth.getSession();

  if (!sessionData.session) {
    $("login").classList.remove("hide");
    $("dashboard").classList.add("hide");
    $("logout").classList.add("hide");
    return;
  }

  try {

    await load();

    $("login").classList.add("hide");
    $("dashboard").classList.remove("hide");
    $("logout").classList.remove("hide");

    show("Signed in as Super Admin");

  } catch (e) {

    $("login").classList.remove("hide");
    $("dashboard").classList.add("hide");

    show(e.message, true);
  }
}

// ----------------------------------------
// LOGIN
// ----------------------------------------

$("loginForm").addEventListener(
  "submit",
  async e => {

    e.preventDefault();

    try {

      const { error } =
        await client.auth.signInWithPassword({
          email: $("loginEmail").value,
          password: $("loginPassword").value
        });

      if (error) throw error;

      $("loginPassword").value = "";

      await refresh();

    } catch (e) {
      show(e.message, true);
    }
  }
);

// ----------------------------------------
// LOGOUT
// ----------------------------------------

$("logout").onclick = async () => {
  await client.auth.signOut();
  show("Signed out");
  await refresh();
};

// ----------------------------------------
// CREATE INSTITUTE
// ----------------------------------------

$("instituteForm").addEventListener(
  "submit",
  async e => {

    e.preventDefault();

    try {

      await request({
        action: "create_institute",
        name: $("instituteName").value.trim()
      });

      $("instituteForm").reset();

      await load();

      show("Institute created successfully");

    } catch (e) {
      show(e.message, true);
    }
  }
);

// ----------------------------------------
// CREATE ADMINISTRATOR
// ----------------------------------------

$("adminForm").addEventListener(
  "submit",
  async e => {

    e.preventDefault();

    try {

      await request({
        action: "create_admin",
        name: $("adminName").value.trim(),
        email: $("adminEmail").value.trim(),
        password: $("adminPassword").value,
        institute_id: $("adminInstitute").value
      });

      $("adminForm").reset();

      await load();

      show(
        "Administrator created and assigned successfully"
      );

    } catch (e) {
      show(e.message, true);
    }
  }
);

// ----------------------------------------
// DISABLE ADMINISTRATOR
// ----------------------------------------

$("admins").addEventListener(
  "click",
  async e => {

    const id = e.target
      .closest("[data-disable]")
      ?.dataset.disable;

    if (!id) return;

    if (!confirm(
      "Disable sign-in for this administrator?"
    )) {
      return;
    }

    try {

      await request({
        action: "disable_admin",
        user_id: id
      });

      show(
        "Administrator sign-in disabled. Existing sessions may remain active until expiration."
      );

    } catch (e) {
      show(e.message, true);
    }
  }
);

// ----------------------------------------
// INITIAL PAGE LOAD
// ----------------------------------------

refresh();

</script>

</body>
</html>
